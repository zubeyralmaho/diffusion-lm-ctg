name: diffusion_lm_vanilla
# Faithful Diffusion-LM (Li et al., 2022): x0-prediction, sqrt schedule,
# BERT-initialized embeddings, prefix conditioning — but WITHOUT our three
# additions (self-conditioning, EMA, classifier guidance). This is the
# "what do the additions buy?" baseline: compare against the full model.
model:
  type: diffusion_lm
  embedding_dim: 768
  hidden_dim: 512
  num_layers: 6
  num_heads: 8
  vocab_size: 30522
  tokenizer: bert-base-uncased
  init_from_tokenizer_embeddings: true
diffusion:
  num_timesteps: 2000
  noise_schedule: sqrt
  prediction_type: x0
  self_conditioning: false   # ablated
  mse_lambda: 1000.0
  ema:
    enabled: false           # ablated
  classifier_guidance:
    enabled: false           # ablated
data:
  dataset: e2e_nlg
  max_length: 96
  prefix_length: 32
  batch_size: 64
train:
  epochs: 20
  lr: 1.0e-4
  weight_decay: 0.0
  warmup_steps: 1000
  output_dir: checkpoints/diffusion_lm_vanilla
generate:
  num_samples: 5
  batch_size: 16
  ddim_steps: 200
  rounding_interval: 10
  classifier_guidance_scale: 0.0
