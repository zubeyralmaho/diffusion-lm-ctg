name: diffusion_lm
model:
  type: diffusion_lm
  embedding_dim: 128
  hidden_dim: 512
  num_layers: 6
  num_heads: 8
  vocab_size: 30522        # bert-base-uncased tokenizer
  tokenizer: bert-base-uncased
diffusion:
  num_timesteps: 2000
  noise_schedule: sqrt     # Diffusion-LM uses sqrt schedule
  self_conditioning: true
data:
  dataset: e2e_nlg
  max_length: 64
  batch_size: 64
train:
  epochs: 20
  lr: 1.0e-4
  weight_decay: 0.0
  warmup_steps: 1000
  output_dir: checkpoints/diffusion_lm
generate:
  num_samples: 5
  ddim_steps: 200
  classifier_guidance_scale: 0.0
  controllable:
    enabled: true
    attribute: food         # E2E slot to control
