name: diffusion_lm
model:
  type: diffusion_lm
  embedding_dim: 768
  hidden_dim: 512
  num_layers: 6
  num_heads: 8
  vocab_size: 30522        # bert-base-uncased tokenizer
  tokenizer: bert-base-uncased
  init_from_tokenizer_embeddings: true
diffusion:
  num_timesteps: 2000
  noise_schedule: sqrt     # Diffusion-LM uses sqrt schedule
  self_conditioning: true
  ema:
    enabled: true
    decay: 0.999
  classifier_guidance:
    enabled: true
    attribute: food
    hidden_dim: 256
    loss_weight: 0.1
data:
  dataset: e2e_nlg
  max_length: 96
  prefix_length: 32       # MR prefix; target_len = max_length - prefix_length
  batch_size: 64
train:
  epochs: 20
  lr: 1.0e-4
  weight_decay: 0.0
  warmup_steps: 1000
  output_dir: checkpoints/diffusion_lm
generate:
  num_samples: 5
  batch_size: 16
  ddim_steps: 200
  rounding_interval: 10
  classifier_guidance_scale: 0.5
  controllable:
    enabled: true
    attribute: food         # E2E slot to control
