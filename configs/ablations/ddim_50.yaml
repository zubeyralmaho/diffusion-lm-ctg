name: diffusion_lm_ddim50
model:
  type: diffusion_lm
  embedding_dim: 768
  hidden_dim: 512
  num_layers: 6
  num_heads: 8
  vocab_size: 30522
  tokenizer: bert-base-uncased
  init_from_tokenizer_embeddings: true
diffusion:
  num_timesteps: 2000
  noise_schedule: sqrt
  self_conditioning: true
  mse_lambda: 1000.0
  ema:
    enabled: true
    decay: 0.999
  classifier_guidance:
    enabled: true
    attribute: food
    hidden_dim: 256
    loss_weight: 0.1
data:
  dataset: e2e_nlg
  max_length: 96
  prefix_length: 32
  batch_size: 64
train:
  epochs: 20
  lr: 1.0e-4
  weight_decay: 0.0
  warmup_steps: 1000
  output_dir: checkpoints/diffusion_lm   # reuse base checkpoint, only sampling differs
generate:
  num_samples: 5
  batch_size: 16
  ddim_steps: 50
  rounding_interval: 10
  classifier_guidance_scale: 0.5
